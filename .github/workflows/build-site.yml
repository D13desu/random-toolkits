name: Build and deploy tool site

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble self-contained site endpoints
        shell: pwsh
        run: ./tests/Sync-Site.ps1

      - name: Test registry module
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        run: ./tests/Test-RegistryTweaks.ps1

      - name: Test M365 menu engine
        shell: pwsh
        run: ./tests/Test-M365MenuEngine.ps1

      - name: Test Sysinternals Live launchers
        shell: pwsh
        run: ./tests/Test-SysinternalsLauncher.ps1

      - name: Test certificate and TLS diagnostics
        shell: pwsh
        run: ./tests/Test-CertificateTls.ps1

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shell: [pwsh, powershell]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run safe Windows test suite on ${{ matrix.shell }}
        shell: ${{ matrix.shell }}
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        run: ./tests/Invoke-WindowsTests.ps1 -Suite Safe

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main'
    needs: [build, windows-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
